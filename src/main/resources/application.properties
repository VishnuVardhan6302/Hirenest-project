```properties
spring.application.name=hirenest

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/hirenest_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# OTP
app.otp.expiration-minutes=5
app.otp.max-attempts=5

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=8080

# Bootstrap Admin
hirenest.bootstrap-admin.username=${HIRENEST_BOOTSTRAP_ADMIN_USERNAME:}
hirenest.bootstrap-admin.email=${HIRENEST_BOOTSTRAP_ADMIN_EMAIL:}
hirenest.bootstrap-admin.password=${HIRENEST_BOOTSTRAP_ADMIN_PASSWORD:}

# Security Logging
logging.level.org.springframework.security=TRACE
